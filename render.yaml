# Render Blueprint cho REST API (thư mục backend/). Dữ liệu nằm ở MongoDB Atlas, các khoá bí mật nhập trên Render.
services:
  - type: web
    name: bai-giu-xe-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh # tính phí qua đêm, chia ngày doanh thu theo giờ Việt Nam
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI # Atlas -> Connect -> Drivers, database baigiuxe
        sync: false
      - key: PLATE_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
