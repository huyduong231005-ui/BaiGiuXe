[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/OSSLibraries/Arduino_MFRC522v2.git#2.0.6
    robtillaart/I2CKeyPad@^0.5.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
    madhephaestus/ESP32Servo@^3.0.6
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^1.4.3

; Firmware chính
[env:esp32dev]
build_src_filter = +<*> -<hwtest.cpp>

; Kiểm tra từng linh kiện: pio run -e hwtest -t upload && pio device monitor
[env:hwtest]
build_src_filter = +<hwtest.cpp>
